name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: tenderlens_test
          POSTGRES_USER: tenderlens
          POSTGRES_PASSWORD: ci-only-disposable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenderlens -d tenderlens_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tenderlens:ci-only-disposable@localhost:5432/tenderlens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e backend
      - run: ruff check backend scripts
      - run: ruff format --check backend
      - run: pytest backend/tests
      - run: alembic upgrade head && alembic upgrade head
        working-directory: backend
      - run: python scripts/verify_migrations.py
      - run: pytest backend/tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tenderlens:ci-only-disposable@localhost:5432/tenderlens_test
      - run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.lock && .venv/bin/pip install --no-deps -e backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run build && npm audit
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: frontend/test-results

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet && docker compose build
