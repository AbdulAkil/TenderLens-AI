x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://tenderlens:local-development-only@postgres:5432/tenderlens}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenderlens}
      POSTGRES_USER: ${POSTGRES_USER:-tenderlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped

  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    command: ["sh", "-c", "alembic upgrade head && uvicorn tenderlens.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    command: ["python", "-m", "tenderlens.saas.worker"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        API_INTERNAL_URL: http://api:8000
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  frontend-check:
    build:
      context: ./frontend
      target: builder
    profiles: ["tools"]
    command: ["npm", "run", "lint"]

volumes:
  postgres_data:
