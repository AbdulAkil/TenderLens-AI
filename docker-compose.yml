services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenderlens}
      POSTGRES_USER: ${POSTGRES_USER:-tenderlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://tenderlens:change-me-in-production@postgres:5432/tenderlens}
      TED_API_BASE_URL: ${TED_API_BASE_URL:-https://api.ted.europa.eu}
      TED_API_TIMEOUT_SECONDS: ${TED_API_TIMEOUT_SECONDS:-30}
      TED_API_MAX_RETRIES: ${TED_API_MAX_RETRIES:-3}
      TED_INGESTION_ENABLED: ${TED_INGESTION_ENABLED:-false}
      DOCUMENT_PROCESSING_ENABLED: ${DOCUMENT_PROCESSING_ENABLED:-false}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-false}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-5.4-mini}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-keyword}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn tenderlens.main:app --host 0.0.0.0 --port 8000"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"

  frontend-check:
    build:
      context: ./frontend
      target: builder
    profiles: ["tools"]
    command: ["npm", "run", "lint"]

volumes:
  postgres_data:
